[appearance]
  spacing = "normal"
  [appearance.blocks]
    show_block_dividers = true
  [appearance.input]
    input_mode = "pinned_to_bottom"
  [appearance.tabs]
    tab_close_button_position = "right"
    [appearance.tabs.header_toolbar_chip_selection]
      [appearance.tabs.header_toolbar_chip_selection.custom]
        left = ["tabs_panel", "agent_management"]
        right = ["tools_panel", "code_review", "notifications_mailbox"]
  [appearance.text]
    font_size = 13.0
    notebook_font_size = 14.0
  [appearance.themes]
    theme = "dark"
  [appearance.vertical_tabs]
    display_granularity = "tabs"
    enabled = true
    primary_info = "working_directory"
    show_panel_in_restored_windows = false
    tab_item_mode = "focused_session"
    view_mode = "expanded"

[code]
  [code.editor]
    show_code_review_button = true
    show_global_search = true
    show_project_explorer = true

[general]
  default_session_mode = "terminal"

[notifications]
  toast_duration_secs = 8
  [notifications.preferences]
    is_agent_task_completed_enabled = true
    is_long_running_enabled = true
    is_needs_attention_enabled = true
    is_password_prompt_enabled = true
    long_running_threshold = 30
    mode = "dismissed"
    play_notification_sound = true

[terminal]
  osc52_clipboard_access = "write_only"
  [terminal.input]
    alias_expansion_enabled = false
    completions_open_while_typing = true
    honor_ps1 = true
    input_box_type_setting = "classic"

[text_editing]
  vim_mode_enabled = true

[warpify]
  [warpify.ssh]
    enable_ssh_warpification = false
    reuse_existing_control_master = false
    ssh_extension_install_mode = "never_install"
  [warpify.subshells]
    subshell_commands_denylist = []
